name: Generate contribution snake

on:
  # rebuild every day so the snake always reflects the latest pushes
  schedule:
    - cron: "0 0 * * *"
  # run it by hand from the Actions tab
  workflow_dispatch:
  # and whenever the README or this workflow changes
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # reads your public contribution graph and builds light + dark SVGs
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # publishes the SVGs to a separate "output" branch so main stays clean
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
