<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Ritik Chauhan, AI/ML and Backend Engineer. FastAPI, RAG, OCR automation." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#10233f"/>
      <stop offset="1" stop-color="#0d3b43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="260" rx="20"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    /* rotating role line: three texts share one spot, 9s loop */
    .role { opacity: 0; animation: role 9s ease-in-out infinite; }
    .r2 { animation-delay: 3s; }
    .r3 { animation-delay: 6s; }
    @keyframes role {
      0%   { opacity: 0; transform: translateY(10px); }
      6%   { opacity: 1; transform: translateY(0); }
      28%  { opacity: 1; transform: translateY(0); }
      34%  { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; }
    }

    /* terminal lines appear one after another, 10s loop */
    .t { opacity: 0; animation: term 10s ease-out infinite; }
    .t1 { animation-delay: 0.4s; }
    .t2 { animation-delay: 1.2s; }
    .t3 { animation-delay: 1.9s; }
    .t4 { animation-delay: 2.6s; }
    @keyframes term {
      0%   { opacity: 0; }
      4%   { opacity: 1; }
      88%  { opacity: 1; }
      96%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    @keyframes pulse {
      0%   { opacity: 0.7; transform: scale(1); }
      100% { opacity: 0;   transform: scale(2.6); }
    }

    .float1 { animation: float 9s ease-in-out infinite; }
    .float2 { animation: float 12s ease-in-out infinite reverse; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>

    <!-- soft floating glows -->
    <circle class="float1" cx="1040" cy="40" r="120" fill="#38bdf8" opacity="0.10"/>
    <circle class="float2" cx="560" cy="250" r="140" fill="#34d399" opacity="0.08"/>

    <!-- subtle dot grid -->
    <g fill="#ffffff" opacity="0.05">
      <circle cx="40" cy="30" r="2"/><circle cx="80" cy="30" r="2"/><circle cx="120" cy="30" r="2"/>
      <circle cx="40" cy="70" r="2"/><circle cx="80" cy="70" r="2"/><circle cx="120" cy="70" r="2"/>
    </g>

    <!-- open to work pill -->
    <rect x="70" y="40" width="200" height="32" rx="16" fill="#34d399" opacity="0.14"/>
    <circle class="pulse" cx="92" cy="56" r="5" fill="#34d399"/>
    <circle cx="92" cy="56" r="5" fill="#34d399"/>
    <text class="sans" x="108" y="61" font-size="14" font-weight="700" letter-spacing="1.5" fill="#a7f3d0">OPEN TO WORK</text>

    <!-- name -->
    <text class="sans" x="68" y="136" font-size="58" font-weight="800" fill="#ffffff">Ritik Chauhan</text>
    <rect x="70" y="150" width="120" height="5" rx="2.5" fill="url(#accent)"/>

    <!-- rotating roles -->
    <text class="sans role r1" x="70" y="196" font-size="27" font-weight="600" fill="#cbd5e1">AI/ML &amp; Backend Engineer</text>
    <text class="sans role r2" x="70" y="196" font-size="27" font-weight="600" fill="#cbd5e1">FastAPI · RAG · OCR Automation</text>
    <text class="sans role r3" x="70" y="196" font-size="27" font-weight="600" fill="#cbd5e1">Automating work for small businesses</text>

    <text class="sans" x="70" y="232" font-size="16" fill="#94a3b8">India · Remote friendly · Freelance since 2025</text>

    <!-- terminal card -->
    <rect x="720" y="36" width="420" height="188" rx="14" fill="#0a0f1a" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="744" cy="58" r="6" fill="#f87171"/>
    <circle cx="764" cy="58" r="6" fill="#fbbf24"/>
    <circle cx="784" cy="58" r="6" fill="#34d399"/>
    <line x1="720" y1="78" x2="1140" y2="78" stroke="#ffffff" stroke-opacity="0.08"/>

    <text class="mono t t1" x="744" y="110" font-size="16" fill="#e2e8f0"><tspan fill="#38bdf8">$</tspan> docker compose up -d</text>
    <text class="mono t t2" x="744" y="140" font-size="16" fill="#e2e8f0"><tspan fill="#34d399">✔</tspan> fastapi      running</text>
    <text class="mono t t3" x="744" y="166" font-size="16" fill="#e2e8f0"><tspan fill="#34d399">✔</tspan> ocr-worker   running</text>
    <text class="mono t t4" x="744" y="192" font-size="16" fill="#e2e8f0"><tspan fill="#34d399">✔</tspan> sheets-sync  connected</text>
    <rect class="blink" x="744" y="204" width="9" height="3" fill="#38bdf8"/>
  </g>
</svg>
